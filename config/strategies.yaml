# Strategy configs: each is the same engine with different settings.

base:
  stop: opposite_band
  sizing: fixed

vwap_stop:
  stop: band_vwap
  sizing: fixed

final:
  stop: band_vwap
  sizing: vol_target
  target_vol: 0.02
  max_leverage: 4

own_turbulence:
  stop: band_vwap
  sizing: vol_target
  target_vol: 0.02
  max_leverage: 4
  intraday_sizing: turbulence
  size_floor: 0.5
  size_cap: 1.5

own_ml_vol:
  stop: band_vwap
  sizing: vol_target
  target_vol: 0.02
  max_leverage: 4
  intraday_sizing: ml_vol
  size_floor: 0.5
  size_cap: 1.5
