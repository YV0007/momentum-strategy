# Ablation ladder: the final strategy built up one decision at a time.

s1_open_band:
  stop: opposite_band
  sizing: fixed
  gap_adjust: false

s2_gap_adjusted:
  stop: opposite_band
  sizing: fixed

s3_band_stop:
  stop: band
  sizing: fixed

s3b_vwap_stop_only:
  stop: vwap
  sizing: fixed

s4_band_and_vwap_stop:
  stop: band_vwap
  sizing: fixed

s5_constant_leverage:
  stop: band_vwap
  sizing: fixed
  leverage: 2.66

s6_vol_target:
  stop: band_vwap
  sizing: vol_target
  target_vol: 0.02
  max_leverage: 4

s6b_vwap_stop_vol_target:
  stop: vwap
  sizing: vol_target
  target_vol: 0.02
  max_leverage: 4
