# Fixed research rules: periods, capital, costs, metrics and success criteria.

split:
  train_start: "2016-01-01"
  train_end: "2022-12-31"
  test_start: "2023-01-01"
  post_publication_start: "2024-05-10"

capital:
  initial_aum: 100000

costs:
  commission: 0.0035
  slippage: 0.001

metrics:
  trading_days_per_year: 252
  risk_free_rate: 0.0
  required: [sharpe, annual_return, annual_volatility]

success:
  min_sharpe: 0.5
  must_beat: [buy_and_hold, placebo]
